<!doctype html><html lang="zh-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APPT Printer 預約條列印端</title>
<!-- 引用籌號系統樣式：確保字體與抬頭尺寸完全一致 Reuse queue system stylesheet for identical font & header sizes -->
<link rel="stylesheet" href="../css/style.css">
<style>
body{margin:0;background:#f1f5f9;color:#0f172a}
.wrap{max-width:900px;margin:18px auto;padding:0 16px;display:grid;gap:16px}
.card{background:#fff;border:2px solid #94a3b8;border-radius:16px;padding:20px}
.card h3{margin:0 0 12px;font-size:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
.dot{width:14px;height:14px;border-radius:50%;background:#16a34a;box-shadow:0 0 8px #16a34a;display:inline-block}
button.act{border:0;border-radius:12px;padding:14px 22px;font-size:17px;font-weight:800;color:#fff;background:#b45309;cursor:pointer}
button.act2{background:#475569}
.log{background:#0b1220;color:#4ade80;font-family:ui-monospace,monospace;font-size:14px;border-radius:12px;padding:12px;height:260px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px solid #1e293b}
</style>
</head><body>
<div class="topbar"><span>🖨️ APPT Printer 預約條列印端</span><span class="chip" id="countChip">Queue 隊列：0</span></div>
<div class="wrap">
  <div class="card">
    <h3>Status 狀態</h3>
    <div class="row" style="margin-top:0"><span class="dot"></span><b style="font-size:18px">已連線・監控預約隊列中 Online & watching</b></div>
    <div class="row">
      <button class="act" id="btnTest">Test Print 測試列印</button>
      <button class="act act2" id="btnClear">Clear Queue 清空隊列</button>
    </div>
  </div>
  <div class="card"><h3>Print Log 列印記錄</h3><div class="log" id="log"></div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="appt-core.js"></script>
<script>
APPT.init();
const $ = id => document.getElementById(id);
const log = m => { const d=document.createElement('div'); d.textContent=`[${new Date().toLocaleTimeString()}] ${m}`; $('log').prepend(d); };
const printer = APPT.startPrinter({ onLog: log, onCount: n => { $('countChip').textContent = 'Queue 隊列：' + n; } });

$('btnTest').onclick = () => {
  if (!confirm('Test print a sample slip?\n測試列印樣本預約條？')) return;
  printer.testPrint({ name:'Chan Tai Man', form:'3', classNo:'15', shouldSee:'Mr Wong',
    date:APPT.todayStr(), time:'12:00', place:'Office', remark:'Sample slip', issued:APPT.nowLabel() });
};
$('btnClear').onclick = async () => {
  if (!confirm('Clear all appointment print queue?\n清空所有預約列印隊列？')) return;
  await APPT.DB.remove('printQueue');
  log('Queue cleared 隊列已清空');
};
</script>
</body></html>
