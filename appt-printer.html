<!doctype html><html lang="zh-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APPT Printer 預約條列印端</title>
<link rel="stylesheet" href="css/style.css">
<style>
.tag{background:#e2e8f0 !important;color:#0f172a !important;border:1px solid #64748b;border-radius:999px;padding:8px 16px;font-size:16px;font-weight:800}
.dot{width:14px;height:14px;border-radius:50%;background:#dc2626;display:inline-block;flex:none}
.dot.on{background:#16a34a;box-shadow:0 0 8px #16a34a}
.log{background:#0b1220;color:#4ade80;font-family:ui-monospace,monospace;font-size:14px;border-radius:12px;padding:12px;height:280px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px solid #1e293b}
.log .err{color:#f87171; font-weight:700;}

#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  
  /* 72mm 寬並水平置中，避開打印機左側硬體盲區 */
  #printArea{
    display:block !important; 
    position:absolute; 
    left:50%; 
    top:0; 
    transform:translateX(-50%); 
    width:72mm;
  }
  
  /* 預約條樣式 (72mm 寬) */
  #printArea .s-page{
    width:72mm !important; 
    padding:0 2mm !important; 
    min-height:140mm;
    box-sizing:border-box; 
    display:flex; 
    flex-direction:column;
    font-family:'Microsoft JhengHei','微軟正黑體',sans-serif;
    font-size:13px; line-height:1.4; color:#000;
  }
  
  /* 學校名稱：縮小至 13px (與內文同)，普通粗體 */
  #printArea .s-page .t-head{display:flex; align-items:center; gap:2mm; padding-bottom:2mm; margin-bottom:2mm; border-bottom:0.3mm solid #000;}
  #printArea .s-page .t-head img{width:10mm; height:10mm; object-fit:contain;}
  #printArea .s-page .t-school-zh{font-size:13px; font-weight:600; line-height:1.4; letter-spacing:0}
  
  #printArea .s-page .s-title{font-size:16px; font-weight:700; text-align:center; margin:1.5mm 0 3mm; letter-spacing:1px;}
  
  /* 🟢 修正表格：強制移除 style.css 帶入的圓角與裁切，縮小行距 */
  #printArea .s-page .s-table{
    width:100%; 
    border-collapse:collapse;
    border-radius:0 !important;      /* 強制取消圓角 */
    overflow:visible !important;     /* 強制取消裁切，防止文字被切掉 */
    background:transparent !important;
    box-shadow:none !important;
  }
  #printArea .s-page .s-table th,#printArea .s-page .s-table td{
    border:none !important;          /* 強制取消 style.css 的底線 */
    padding:0.8mm 0 !important; 
    line-height:1.3; 
    text-align:left; 
    vertical-align:top; 
    white-space:normal; 
    word-break:break-word; 
    overflow-wrap:anywhere;
  }
  #printArea .s-page .s-table th{width:38%; font-weight:600;}
  
  #printArea .s-page .s-div{border-top:0.3mm solid #000; margin:2mm 0 1.5mm;}
  #printArea .s-page .s-remark-label{font-weight:600; margin-bottom:0.5mm;}
  #printArea .s-page .s-remark-text{line-height:1.4; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;}
  #printArea .s-page .s-foot{margin-top:auto; padding-top:2mm; font-size:11px; line-height:1.4;}

  /* 🟩 分類黑條樣式 (72mm 寬，1cm 高，強制純黑) */
  #printArea.divider-page{
    width:72mm !important; 
    height:10mm !important; 
    background:#000 !important; 
    margin:0 !important; 
    padding:0 !important;
    -webkit-print-color-adjust: exact !important; 
    print-color-adjust: exact !important; 
    color-adjust: exact !important;
  }
}
</style>
</head><body>

<div class="topbar"><span>🖨️ APPT Printer 預約條列印端</span><span class="chip" id="countChip">Queue 隊列：0</span></div>
<div class="admin-wrap">
  <div class="card">
    <h3>Status 狀態</h3>
    <div class="row" style="align-items:center">
      <span class="dot" id="dot"></span>
      <b id="statusText" style="font-size:18px">等待連線 Connecting…</b>
    </div>
    <p class="muted" style="margin-top:8px">此電腦需保持開啟並連接熱敏打印機。預約條指令會在此自動列印。<br>
    Keep this PC on with the thermal printer. Appointment slips print here automatically.</p>
    <div class="row" style="margin-top:12px">
      <button id="btnTest" class="btn-amber">Test Print 測試列印</button>
      <button id="btnDivider" class="btn-gray">🟩 Print Divider 打印分類黑條</button>
      <button id="btnClearQueue" class="btn-gray">Clear Queue 清空列印隊列</button>
    </div>
  </div>
  <div class="card"><h3>Print Log 列印記錄</h3><div class="log" id="log"></div></div>
</div>

<div id="printArea"></div>
<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="config.js"></script>
<script src="appt-core.js"></script>

<script>
const $ = id => document.getElementById(id);
const jobs = []; const seen = {}; let printing = false;

function log(msg, isErr){ 
  const d=document.createElement('div'); 
  if(isErr) d.className = 'err';
  d.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`; 
  $('log').prepend(d); 
}
function updateCount(){ $('countChip').textContent = 'Queue 隊列：' + jobs.length; }

window.onerror = function(msg, url, line) { log(`❌ JS Error: ${msg} (line ${line})`, true); };

try {
  APPT.init();
  log('⚙️ 核心已初始化 Core initialized');
} catch(e) {
  log('❌ APPT.init() 失敗: ' + e.message, true);
}

try {
  const connectedRef = firebase.database().ref('.info/connected');
  connectedRef.on('value', (snap) => {
    if (snap.val() === true) {
      $('dot').classList.add('on'); 
      $('statusText').textContent='✅ 已連線・監控預約隊列中 Online & watching';
      $('statusText').style.color = '#16a34a';
      
      APPT.DB.on('printQueue', v => { 
        const all=v||{}; 
        Object.keys(all).forEach(k=>{ 
          const j=all[k]; 
          if(j && !j.done && !seen[k]) enqueue(k,j); 
        }); 
      });
    } else {
      $('dot').classList.remove('on');
      $('statusText').textContent='⏳ 等待連線 Connecting…';
      $('statusText').style.color = '';
    }
  });
} catch(e) { log('❌ Firebase 監聽失敗: ' + e.message, true); }

function enqueue(key, j){
  if (seen[key]) return;
  seen[key] = 1;
  jobs.push(Object.assign({ key: key }, j));
  updateCount();
  log(`收到任務 Job: ${j.type === 'divider' ? '🟩 分類黑條 Divider' : ((j.rec&&j.rec.no)||'?')}`);
  processJobs();
}

async function processJobs(){
  if (printing) return;
  printing = true;
  while (jobs.length){
    const j = jobs.shift();
    updateCount();
    await APPT.DB.remove('printQueue/' + j.key).catch(()=>{});
    printJob(j);
    await new Promise(r => setTimeout(r, 900));
  }
  printing = false;
}

function slipHTML(r){
  const T = APPT.CFG.strings;
  const row = (label,val) => `<tr><th>${label}</th><td>${APPT.esc(val)||'—'}</td></tr>`;
  return `<div class="s-page">
    <div class="t-head"><img src="${APPT.CFG.logo}" alt="logo"><div>
      <div class="t-school-zh">${APPT.esc(APPT.CFG.school.en)}</div></div></div>
    <div class="s-title">${T.slipTitle}</div>
    <table class="s-table">
      ${row(T.fName, r.name)}${row(T.fForm, r.form)}${row(T.fClassNo, r.classNo)}
      ${row(T.fShouldSee, r.shouldSee)}${row(T.fDate, r.date)}${row(T.fTime, r.time)}${row(T.fPlace, r.place)}
    </table>
    <div class="s-div"></div>
    <div class="s-remark-label">${T.fRemark}</div>
    <div class="s-remark-text">${APPT.esc(r.remark)||'—'}</div>
    <div class="s-foot">${T.footerNote}<br>${T.issuedAt}: ${APPT.esc(r.issued)}</div>
  </div>`;
}

function printJob(j){
  const pa = $('printArea');
  if (j.type === 'divider') {
    pa.className = 'divider-page';
    pa.innerHTML = '';
  } else {
    pa.className = '';
    pa.innerHTML = slipHTML(j.rec || {});
  }
  const copies = Math.max(1, j.copies || 1);
  setTimeout(() => {
    for (let i=0;i<copies;i++) window.print();
    log(`✅ ${j.type === 'divider' ? 'Divider 黑條' : ((j.rec&&j.rec.no)||'SLIP')} x${copies} 已發送 Sent`);
  }, 250);
}

$('btnTest').onclick = () => {
  if (!confirm('Test print a sample slip?\n測試列印樣本預約條？')) return;
  printJob({ 
    rec:{ name:'Chan Tai Man', form:'3', classNo:'15', shouldSee:'Mr Wong',
      date:APPT.todayStr(), time:'12:00', place:'Office', remark:'Sample slip', issued:APPT.nowLabel() }, 
    copies:1 
  });
};

$('btnDivider').onclick = async () => {
  if (!confirm('加入一張 1cm 分類黑條到列印隊列？\nAdd a 1cm divider to the print queue?')) return;
  await APPT.queuePrint({ type: 'divider' });
  log('🟩 手動加入分類黑條 Manual divider added');
};

$('btnClearQueue').onclick = async () => {
  if (!confirm('Clear all appointment print queue?\n清空所有預約列印隊列？')) return;
  await APPT.DB.remove('printQueue');
  jobs.length = 0; 
  for(let k in seen) delete seen[k];
  updateCount(); 
  log('隊列已清空 Queue cleared');
};

log('⚙️ 系統就緒 System ready (Fixed Table Corners)');
</script>
<!-- 🟢 防後台節流 Hack：播放無聲音訊讓 Chrome 保持頁面活躍 -->
<audio autoplay loop muted playsinline>
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
</audio>
</body></html>
